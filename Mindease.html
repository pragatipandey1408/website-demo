<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MindEase</title>

<style>
body{font-family:Arial;margin:0;background:#f5f8ff;text-align:center;transition:.3s}
.dark{background:#121212;color:#fff}
header{background:#4f46e5;color:#fff;padding:15px;position:sticky;top:0}
button{padding:10px 15px;border:none;border-radius:10px;cursor:pointer;margin:5px}
.card{background:#fff;padding:15px;margin:10px auto;border-radius:15px;max-width:350px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.dark .card{background:#222}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding:10px}
.feature{background:white;padding:15px;border-radius:12px;cursor:pointer}
.dark .feature{background:#222}
.dot{width:70px;height:70px;background:#2563eb;border-radius:50%;margin:20px auto;animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(1.3)}}
.breathe{width:100px;height:100px;background:#3b82f6;border-radius:50%;margin:20px auto;animation:breathe 8s infinite}
@keyframes breathe{50%{transform:scale(1.4)}}
#popit{display:grid;grid-template-columns:repeat(5,50px);gap:8px;justify-content:center}
.bubble{width:50px;height:50px;background:#7c3aed;border-radius:50%;cursor:pointer}
.popped{background:#ccc}
input{padding:10px;width:90%;max-width:320px}
#audioControls{margin-top:10px}
</style>
</head>

<body>

<header>
<h1>🧠 MindEase</h1>
<button onclick="toggleTheme()">🌙 Dark Mode</button>
</header>

<h2>Wellness Features</h2>

<div class="grid">
<div class="feature" onclick="show('🧘 Meditation','Take 5 mindful breaths.')">🧘 Meditation</div>
<div class="feature" onclick="show('😴 Sleep','Aim for 7-9 hours.')">😴 Sleep</div>
<div class="feature" onclick="show('🥗 Eating','Eat slowly and mindfully.')">🥗 Eating</div>
<div class="feature" onclick="show('👀 Observation','Use the 5-4-3-2-1 method.')">👀 Observe</div>
<div class="feature" onclick="show('🎯 Focus','Focus on the blue dot.')">🎯 Focus</div>
<div class="feature" onclick="show('💝 Gratitude','Record positive moments.')">💝 Gratitude</div>
</div>

<div id="featureBox" class="card">
Choose a wellness activity.
</div>

<h2>😊 Mood Tracker</h2>

<button onclick="setMood('happy')">😊</button>
<button onclick="setMood('calm')">😌</button>
<button onclick="setMood('sad')">😔</button>
<button onclick="setMood('stressed')">😣</button>

<div id="moodBox"></div>
<div id="soundBox"></div>

<audio id="moodAudio"></audio>

<div id="audioControls" style="display:none">
<button onclick="playAudio()">▶</button>
<button onclick="pauseAudio()">⏸</button>
<button onclick="stopAudio()">⏹</button>

<br>

<input type="range"
id="volume"
min="0"
max="100"
value="70"
oninput="changeVolume()">
</div>

<h2>😴 Sleep Monitor</h2>

<input id="sleepHours" type="number" placeholder="Hours slept">

<button onclick="sleepScore()">
Check
</button>

<div id="sleepResult"></div>

<h2>🥗 Mindful Eating</h2>

<button onclick="mealTip()">
Healthy Tip
</button>

<div id="meal"></div>

<h2>💡 Daily Affirmation</h2>

<button onclick="affirm()">
Generate
</button>

<div id="quote"></div>

<h2>👀 Mindful Observation</h2>

<button onclick="observe()">
Start
</button>

<div id="observeBox"></div>

<h2>🎯 Dot Focus</h2>

<div class="dot"></div>

<h2>🫁 Breathing</h2>

<div class="breathe"></div>

<h2>🫧 Pop-It</h2>

<div id="popit"></div>

<h2>💝 Gratitude Jar</h2>

<input id="gratitude">

<button onclick="addGratitude()">
Add
</button>

<ul id="gratitudeList"></ul>

<script>

const moodData={
happy:{
msg:"Keep spreading positivity!",
music:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
},
calm:{
msg:"Enjoy this peaceful moment.",
music:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
},
sad:{
msg:"Better days are coming.",
music:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"
},
stressed:{
msg:"Take slow deep breaths.",
music:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3"
}
};

function toggleTheme(){
document.body.classList.toggle("dark");
}

function show(title,text){
document.getElementById("featureBox").innerHTML=
`<h3>${title}</h3><p>${text}</p>`;
}

function setMood(mood){

let data=moodData[mood];

document.getElementById("moodBox").innerHTML=
`<div class="card">
<h3>${mood}</h3>
<p>${data.msg}</p>
</div>`;

document.getElementById("soundBox").innerHTML=
`<div class="card">🎵 Mood Sound Ready</div>`;

let audio=document.getElementById("moodAudio");
audio.src=data.music;
audio.volume=.7;

document.getElementById("audioControls").style.display="block";
}

function playAudio(){
document.getElementById("moodAudio").play();
}

function pauseAudio(){
document.getElementById("moodAudio").pause();
}

function stopAudio(){
let a=document.getElementById("moodAudio");
a.pause();
a.currentTime=0;
}

function changeVolume(){
document.getElementById("moodAudio").volume=
document.getElementById("volume").value/100;
}

function sleepScore(){
let h=
Number(document.getElementById("sleepHours").value);

document.getElementById("sleepResult").innerHTML=
h>=8 ? "🌟 Excellent Sleep" :
h>=6 ? "✅ Good Sleep" :
"⚠ Need More Sleep";
}

function mealTip(){

const tips=[
"🥗 Fill half your plate with vegetables",
"💧 Drink water before meals",
"🍎 Choose healthy snacks"
];

document.getElementById("meal").innerHTML=
tips[Math.floor(Math.random()*tips.length)];
}

function affirm(){

const list=[
"I am strong",
"I deserve happiness",
"I grow every day",
"I choose positivity"
];

document.getElementById("quote").innerHTML=
list[Math.floor(Math.random()*list.length)];
}

function observe(){
document.getElementById("observeBox").innerHTML=
"5 see • 4 touch • 3 hear • 2 smell • 1 taste";
}

function addGratitude(){

let text=
document.getElementById("gratitude").value;

if(!text)return;

let li=document.createElement("li");
li.innerHTML="💝 "+text;

document.getElementById("gratitudeList")
.appendChild(li);

document.getElementById("gratitude").value="";
}

let pop=document.getElementById("popit");

for(let i=0;i<20;i++){
let b=document.createElement("div");
b.className="bubble";
b.onclick=()=>b.classList.toggle("popped");
pop.appendChild(b);
}

</script>

</body>
</html>
